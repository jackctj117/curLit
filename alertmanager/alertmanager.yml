global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "category"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: "pager"
      group_wait: 0s
      repeat_interval: 30m

    - match:
        severity: warning
      receiver: "notify"
      repeat_interval: 2h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://localhost:8080/alert-sink"

  - name: "pager"
    pushover_configs:
      - user_key: "${PUSHOVER_USER_KEY}"
        token: "${PUSHOVER_API_TOKEN}"
        priority: 2
        retry: 30s
        expire: 3h
        title: 'FX CRITICAL: {{ .GroupLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "HTML"
        message: |
          🚨 <b>CRITICAL</b>
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          {{ end }}

  - name: "notify"
    pushover_configs:
      - user_key: "${PUSHOVER_USER_KEY}"
        token: "${PUSHOVER_API_TOKEN}"
        priority: 0
        title: 'FX Warning: {{ .GroupLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      alertname: "LiveEngineDown"
    target_match_re:
      category: "(risk|execution|model)"
    equal: ["instance"]
