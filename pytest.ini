[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers --strict-config
markers =
    slow: slow-running tests (hypothesis, large datasets)
    integration: tests that require external services or database
    unit: fast, isolated unit tests
timeout = 120
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
