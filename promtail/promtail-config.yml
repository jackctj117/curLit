server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fx_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: fx_services
          __path__: /opt/fx-system/logs/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            strategy_id: strategy_id
            symbol: symbol
            trade_id: trade_id
      - labels:
          level:
          logger:
          strategy_id:
          symbol:
      - timestamp:
          source: ts
          format: RFC3339Nano

  - job_name: system_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
