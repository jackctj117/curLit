# App-services overlay for docker-compose.yml (CL-mz7, profiled in CL-oluv).
#
# Run alongside the base infra stack:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#     → LIGHT stack: postgres + engine only.
#   docker compose -f docker-compose.yml -f docker-compose.app.yml --profile full up -d
#     → everything: + watchdog, nlp, research dashboard, observability, airflow.
#
# NOTE: the PREVIOUS behavior (all app services on a bare `up -d`) is now
# behind `--profile full`.
#
# Notes on shape:
#   - All app services build from the single canonical ./Dockerfile at the
#     repo root (deploy/Dockerfile was removed in CL-oluv) for image cache
#     reuse. The per-service `command` picks the process.
#   - The engine reads .env via dotenv_bootstrap; secrets come from the
#     compose environment, not baked into the image.
#   - host.docker.internal works on Docker Desktop (Mac/Windows). Linux
#     hosts need `--add-host` or networking via the existing observability
#     bridge — already configured.

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: curlit-app:latest
    container_name: curlit-engine
    restart: unless-stopped
    mem_limit: 2g
    networks: [observability]
    command: python -m src.runtime.run_engine --broker ${BROKER_MODE:-paper}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-fx}
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      OANDA_API_KEY: ${OANDA_API_KEY}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID}
      WEB_API_SECRET: ${WEB_API_SECRET:-curlit-dev}
      # Bind the embedded FastAPI to all container interfaces so the
      # published port below is actually reachable from the host
      # (native default stays loopback-only — see live_engine.py).
      CURLIT_API_HOST: 0.0.0.0
      CURLIT_API_PORT: ${CURLIT_API_PORT:-8200}
      CURLIT_METRICS_PORT: ${CURLIT_METRICS_PORT:-8099}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./logs:/opt/curlit/logs
      - ./reports:/opt/curlit/reports
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CURLIT_API_PORT:-8200}:${CURLIT_API_PORT:-8200}"   # web API
      - "127.0.0.1:${CURLIT_METRICS_PORT:-8099}:${CURLIT_METRICS_PORT:-8099}"   # prometheus metrics
    healthcheck:
      # /health is the unauthenticated liveness route on the embedded
      # FastAPI (CL-oluv) — same check the image HEALTHCHECK runs.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${CURLIT_API_PORT:-8200}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    image: curlit-app:latest
    container_name: curlit-watchdog
    profiles: ["full"]
    restart: unless-stopped
    mem_limit: 256m
    networks: [observability]
    command: python -m scripts.soak_monitor --watch-engine engine:8099
    environment:
      PYTHONUNBUFFERED: "1"
    # The image HEALTHCHECK probes the engine API; irrelevant for the
    # watchdog process — disable rather than report a false unhealthy.
    healthcheck:
      disable: true
    depends_on:
      engine:
        condition: service_healthy

  nlp:
    build:
      context: .
      dockerfile: Dockerfile
    image: curlit-app:latest
    container_name: curlit-nlp
    profiles: ["full"]
    restart: unless-stopped
    mem_limit: 4g
    networks: [observability]
    command: uvicorn src.nlp.service:app --host 0.0.0.0 --port 8400
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-fx}
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8400:8400"
    healthcheck:
      # Override the image-level engine healthcheck with the NLP
      # service's own /health route.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8400/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  research_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: curlit-app:latest
    container_name: curlit-research-dashboard
    profiles: ["full"]
    restart: unless-stopped
    mem_limit: 1g
    networks: [observability]
    # CL-28j: paper triage Streamlit. Reads research_papers + writes
    # status / priority / notes back. Mount the dashboard file rather
    # than rebuild the image on every UI tweak.
    command: streamlit run /opt/curlit/research/dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-fx}
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./research:/opt/curlit/research:ro
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-o", "/dev/null", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: curlit-app:latest
    container_name: curlit-web
    restart: unless-stopped
    mem_limit: 512m
    networks: [observability]
    # Standalone Web API container is redundant when engine is running
    # (engine embeds the same FastAPI). This profile is for read-only
    # dashboards / API consumers that don't run the engine.
    profiles: ["web-only"]
    command: uvicorn src.web.api:app --host 0.0.0.0 --port 8201
    environment:
      WEB_API_SECRET: ${WEB_API_SECRET:-curlit-dev}
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8201:8201"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8201/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
