# CL-0deu.5.1: required-check candidates, never trading or deployment jobs.
name: CI

"on":
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # GitHub's explicit bash shell propagates pipeline failures with pipefail.
    shell: bash

env:
  # Only fixture-backed tests belong here; never opt into real external services.
  CURLIT_RUN_NETWORK_TESTS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    # Includes installation of core scientific/NLP packages on a cold runner.
    timeout-minutes: 30
    strategy:
      # One failing check must not cancel evidence from the other checks.
      fail-fast: false
      matrix:
        include:
          - check: unit-tests
            target: test-unit
          - check: lint
            target: lint
          - check: typecheck
            target: typecheck
    steps:
      # Full commit pins prevent a moved action tag from changing CI code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Exercise the declared minimum Python version, not the runner default.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install patched package installer
        # Match security CI; do not retain the old pip vulnerability exception.
        run: python -m pip install --upgrade "pip==26.2.1" "setuptools>=83.0.0"
      - name: Install CPU-only PyTorch
        # Hosted checks need no CUDA runtime; retain the declared core dependency.
        run: python -m pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install optional dependencies exercised by the unit suite
        run: python -m pip install -e ".[audio,polymarket]"
      - name: Run check
        run: make ${{ matrix.target }}

  recovery-integration:
    name: recovery-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: curlit_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d curlit_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install patched installer and CPU-only dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools>=83.0.0"
          python -m pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Exercise disposable migrations, recovery, and writer fencing
        env:
          CURLIT_AUDIT_TEST_DB_URL: postgresql+psycopg2://fixture:fixture@127.0.0.1:5432/curlit_test_ci
        run: >-
          python -m pytest tests/integration/test_alpaca_ledger_postgres.py
          tests/integration/test_recovery_postgres.py
          tests/integration/test_niche_audit_postgres.py -q -o addopts=''
