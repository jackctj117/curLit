  # Operator-requested; performance claims from these accounts are
  # UNVERIFIED — treat as entertainment, not signal.
  #
  # ACTIVE-HOURS DESIGN (CL-6t7v): these are the ONLY accounts that carry
  # active_hours windows. They post day-RECAPS (entries/exits after the
  # session), so polling them all day is low-signal and inflates bird-call
  # volume. News / flow / OSINT / mining accounts above have NO window on
  # purpose — breaking news at any hour is the whole point; do NOT window
  # them. The windows below are HEURISTIC and freely editable: the traders
  # are anonymous, so their timezones are GUESSES seeded from the
  # operator's table (US traders ~EOD ET, European traders their evenings).
  # Widen/narrow/retz them as you learn each account's real posting rhythm.
