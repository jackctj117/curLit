# X (Twitter) account watchlist — scripts/x_monitor.py (CL-3j86).
#
# Curated by the operator 2026-07-20. Every NEW post from these accounts
# is relayed to Telegram once TWITTER_BEARER_TOKEN is provisioned (X API
# v2 basic tier, paid). Until then the monitor idles — it never scrapes.
#
# Schema:
#   categories:
#     <category_key>:            # must be one of the known categories in
#       accounts:                # src/data/x_monitor.py (footer policy is
#         - handle: <X handle, no @>          #  category-keyed)
#           note: <why it's on the list>
#           priority: high | normal | low     # poll cadence: high = every
#                                             # cycle, normal = every 2nd,
#                                             # low = every 4th
#           keywords: [..]      # OPTIONAL — notify only on posts containing
#                               # any keyword (case-insensitive substring).
#                               # Omit for all posts (the default).
#
# small_traders is operator-requested; performance claims from these
# accounts are UNVERIFIED — treat as entertainment, not signal. Their
# notifications carry an explicit unverified footer.

