# Multi-agent research pipeline config (CL-rzf7).
#
# Schema validated by src/research/config.py:ResearchConfig at load time.
# Adding a new agent or a new debate type is a YAML edit only — no Python
# changes anywhere else. Provider names must match the drivers registered
# in src/research/llm/client.py:_DRIVERS.

providers:
  claude:
    api_key_env: ANTHROPIC_API_KEY
    # Fable 5 ($10/$50 per MTok). The driver drops `temperature` for
    # Fable/Opus-4.7+ models (they 400 on sampling params), opts into
    # the server-side refusal fallback (rescued by opus-4-8), and
    # fails loud on a whole-chain refusal.
    default_model: claude-fable-5
  # deepseek retired as a pipeline provider 2026-07-17 (operator
  # request) — the driver is still registered in client.py for the
  # comparison harness (scripts/compare_llm_providers.py).
  grok:
    api_key_env: XAI_API_KEY
    # NOTE the dot: "grok-4.5" is the API model id; "grok-4-5" 404s.
    # $2/$6 per MTok. Requires XAI_API_KEY in .env.
    default_model: grok-4.5

agents:
  # Reads paper extracts (data/research/extracts/*.md) and emits
  # pre-registered hypothesis briefs. Cheap repetitive task → Grok.
  idea_generator:
    provider: grok
    role: idea_generator
    prompt_path: configs/research_prompts/idea_generator.md
    max_tokens: 4096

  # Writes strategy code from a hypothesis brief and runs the backtest.
  # Code-generation reasoning quality matters → Claude.
  implementer:
    provider: claude
    role: implementer
    prompt_path: configs/research_prompts/implementer.md
    max_tokens: 8192

  # Bull reviewer — argues PROMOTE with evidence cited from REVIEW_RULES.md.
  bull_reviewer:
    provider: claude
    role: bull
    prompt_path: configs/research_prompts/bull_reviewer.md
    max_tokens: 4096

  # Bear reviewer — adversarial; argues REJECT, hunts for failure modes.
  # Grok: distinct training distribution → genuine viewpoint diversity
  # vs Claude-Bull (the switch this comment always anticipated).
  bear_reviewer:
    provider: grok
    role: bear
    prompt_path: configs/research_prompts/bear_reviewer.md
    max_tokens: 4096

  # Routes smart-questions to code/agent/human; bounces ESR-violators.
  # Mostly format-checking + tool-calling → Grok.
  question_resolver:
    provider: grok
    role: resolver
    prompt_path: configs/research_prompts/question_resolver.md
    max_tokens: 2048

  # Reads paper metadata + abstract → produces the four-section markdown
  # extract that the Idea Agent consumes. High-volume, cost-sensitive
  # → Grok.
  paper_extractor:
    provider: grok
    role: paper_extractor
    prompt_path: configs/research_prompts/paper_extractor.md
    max_tokens: 1024

  # CL-l0x: Bayesian modeling council. The Modeler proposes a structured
  # PyMC spec from a hypothesis; the fit-runner tool actually fits;
  # the Fit Evaluator passes/iterates/rejects based on MCMC diagnostics
  # + posterior-predictive checks.

  # Modeler — produces a JSON model spec. Reasoning quality matters
  # (it's basically translating a thesis into Bayesian primitives) →
  # Claude. Sonnet handles this fine; Opus is overkill.
  modeler:
    provider: claude
    role: modeler
    prompt_path: configs/research_prompts/modeler.md
    max_tokens: 2048

  # Fit evaluator — adversarial reviewer for MCMC diagnostics +
  # posterior-predictive checks. Same provider rationale as the bear
  # reviewer: needs to argue against shipping unless the evidence is
  # there.
  fit_evaluator:
    provider: claude
    role: fit_evaluator
    prompt_path: configs/research_prompts/fit_evaluator.md
    max_tokens: 2048

debates:
  # The default promotion-review debate. Bull + Bear go through 4 rounds
  # culminating in a verdict. Adding a different debate type (e.g. a
  # 5-agent committee, a cost-only review, a risk-only review) is just
  # a new entry under this key.
  promotion_review:
    participants:
      - bull_reviewer
      - bear_reviewer
    rules_path: docs/research/REVIEW_RULES.md
    verdict_engine: rule_based
    rounds:
      - name: initial_positions
        type: parallel
      - name: smart_questions
        type: per_agent_async
        sub_loop: list_unknowns_then_resolve
      - name: rebuttal
        type: sequential
      - name: final_position
        type: parallel

  # CL-l0x: Bayesian modeling council — NOT a YAML-defined debate.
  # Orchestrated programmatically in
  # src/research/agents/bayesian_council.py because it interleaves
  # agent calls with a tool call (PyMC fit), which the parallel /
  # sequential / per_agent_async round vocabulary used by
  # promotion_review can't express.
  #
  # The two participating agents (modeler + fit_evaluator) ARE
  # registered in the agents: section above so the orchestrator
  # can construct them via Agent.from_config like any other agent.
  # The orchestration loop lives in code.
