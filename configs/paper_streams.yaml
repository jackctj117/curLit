# Paper-stream config (CL-2klj).
#
# Each feed entry is fetched + parsed by the matching adapter in
# src/research/ingest.py. v1 ships the arXiv adapter only; SSRN, NBER,
# Fed, BIS, AQR and the rest are extensible by adding (a) a YAML entry
# below and (b) a corresponding fetcher class registered in
# ingest._FETCHER_REGISTRY. Tracked as separate beads under CL-h986.

feeds:
  # ============================================================== #
  # Academic preprints (arXiv) — Atom 1.0
  # ============================================================== #
  arxiv_qfin_pm:
    adapter: arxiv
    # arXiv API: portfolio-management category. Atom 1.0 response.
    query_url: |
      http://export.arxiv.org/api/query?search_query=cat:q-fin.PM&max_results=25&sortBy=submittedDate&sortOrder=descending
    source_label: arXiv q-fin.PM

  arxiv_qfin_tr:
    adapter: arxiv
    # Trading & market microstructure category.
    query_url: |
      http://export.arxiv.org/api/query?search_query=cat:q-fin.TR&max_results=25&sortBy=submittedDate&sortOrder=descending
    source_label: arXiv q-fin.TR

  # ============================================================== #
  # Quant / macro substacks + blogs (RSS 2.0)
  # ============================================================== #
  # Curation principle: small, specialized, signal-dense. Idea agent
  # will DECLINE most posts (they're commentary, not falsifiable
  # theses) — that's correct. The 1-in-50 quant blog post that's a
  # genuine FX-applicable insight is what we're after.
  alpha_architect:
    adapter: rss
    # Quant-research blog from Alpha Architect — published-paper
    # summaries with practical applicability slants
    query_url: https://alphaarchitect.com/feed/
    source_label: Alpha Architect

  newfound_research:
    adapter: rss
    # Flirting with Models — Corey Hoffstein's quant research blog
    # (regime / trend / portfolio construction)
    query_url: https://blog.thinknewfound.com/feed/
    source_label: Newfound Research

  doomberg:
    adapter: rss
    # Macro/energy/commodity contrarian takes; signal-dense substack
    query_url: https://newsletter.doomberg.com/feed
    source_label: Doomberg

  the_diff:
    adapter: rss
    # Byrne Hobart's substack — capital-markets and technology essays;
    # frequent FX/macro relevance
    query_url: https://www.thediff.co/feed
    source_label: The Diff

  concoda:
    adapter: rss
    # Conor Sen Mac Eochaidh's macro/funding-markets substack
    query_url: https://concoda.substack.com/feed
    source_label: Concoda

  macro_hive:
    adapter: rss
    # Bilal Hafeez's macro research feed — institutional-quality FX
    # and rates commentary
    query_url: https://macrohive.com/feed/
    source_label: Macro Hive

  # ============================================================== #
  # NBER working papers (CL-kxcs) — RSS 2.0
  # ============================================================== #
  # NBER's "new working papers" feed; covers all programs, IFM and
  # Asset Pricing are the relevant ones for FX. The idea agent
  # filters out the rest at extract time.
  nber_new:
    adapter: rss
    query_url: https://www.nber.org/rss/new.xml
    source_label: NBER Working Papers

  # ============================================================== #
  # Fed FRBSF Economic Letter (CL-kxcs) — RSS 2.0
  # ============================================================== #
  frbsf_econletter:
    adapter: rss
    query_url: https://www.frbsf.org/economic-research/publications/economic-letter/feed/
    source_label: FRBSF Economic Letter

  # ============================================================== #
  # BIS working papers (CL-kxcs) — Atom-style RSS
  # ============================================================== #
  bis_wp:
    adapter: rss
    query_url: https://www.bis.org/doclist/wppubls.rss
    source_label: BIS Working Papers

  # ============================================================== #
  # SSRN financial markets eJournal (CL-kxcs) — custom adapter
  # ============================================================== #
  # SSRN doesn't expose a public RSS feed for browsing networks;
  # we use a project-specific fetcher that hits their listing page
  # and parses the abstract list.
  ssrn_finmarkets:
    adapter: ssrn
    query_url: https://papers.ssrn.com/sol3/JELJOUR_Results.cfm?form_name=journalBrowse&journal_id=2596228
    source_label: SSRN Financial Markets eJournal

  # ============================================================== #
  # Prediction markets — Polymarket Gamma API
  # ============================================================== #
  # Filtered to FX/macro keywords (fed/cpi/election/dollar/etc.) at
  # fetch time so we don't burn extractor budget on sports/crypto
  # markets that don't move FX. v1 surfaces market-implied
  # probabilities as "extracts" the agents read; v2 (filed) would
  # ingest the price time-series into DataProvider so strategies can
  # use them as features.
  polymarket_macro:
    adapter: polymarket
    query_url: https://gamma-api.polymarket.com/markets?active=true&closed=false&limit=200
    source_label: Polymarket (FX/macro)
