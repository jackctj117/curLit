[project]
name = "curlit"
version = "0.1.0"
description = "Algorithmic FX trading system with AI-driven analysis"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "jackctj117", email = "jackctj117@gmail.com"},
]
keywords = ["forex", "trading", "nlp", "quant"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Data processing
    "pandas>=2.0",
    "numpy>=1.24",
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # API / HTTP
    "httpx>=0.24",
    "tenacity>=8.2",
    # Modelling
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "hmmlearn>=0.3",       # CL-rsv regime detection
    "pypdf>=4.0",          # CL-sy32 PDF text extraction
    "pymc>=5.0",           # CL-l0x Bayesian hierarchical rate diff
    # NLP
    "spacy>=3.6",
    "transformers>=4.30",
    "torch>=2.0",
    "beautifulsoup4>=4.12",
    # Finance
    "yfinance>=0.2",
    "holidays>=0.35",
    # Observability
    "prometheus-client>=0.17",
    # Web
    "fastapi>=0.100",
    "uvicorn>=0.23",
    # Labelling
    "streamlit>=1.26",
    # LLM providers (CL-h986 research pipeline)
    "anthropic>=0.40",
    "openai>=2.0",        # used as DeepSeek + xAI Grok base (OpenAI-compat)
    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "hypothesis>=6.82",
    "ruff>=0.1",
    "mypy>=1.5",
    "black>=23.7",
    "pre-commit>=3.3",
]
train = [
    "datasets>=2.14",
    "evaluate>=0.4",
    "tensorboard>=2.13",
    "optuna>=4.0",         # CL-4nnr walk-forward hyperparameter search
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
]
polymarket = [
    # CL-poly-3 — install for Amoy / mainnet trading. Heavy EVM stack.
    "py-clob-client>=0.10",
    "web3>=6.0",
    "eth-account>=0.10",
]
altdata = [
    # CL-6sp — alternative data ingestion. Google Trends needs pytrends;
    # ENTSO-E uses the raw REST API via httpx (core dep), no extra needed.
    "pytrends>=4.9",
]
audio = [
    # CL-68e — FOMC presser audio prosody prototype (scripts/analyze_cb_audio.py).
    "openai-whisper>=20250625",
    "librosa>=0.11",
    "soundfile>=0.13",
    # Bundled ffmpeg binary — dev hosts have no system ffmpeg; used for
    # MP4 → 16 kHz WAV extraction (whisper itself is fed numpy arrays).
    "imageio-ffmpeg>=0.5",
]
social = [
    # CL-risk-profile — Reddit + extended social-source ingest.
    # PRAW is the only dep (4chan / lainchan / HN / Twitter use stdlib + httpx).
    "praw>=7.7",
]
browser = [
    # CL-nj2h — Playwright transport for bot-gated feeds (SSRN listing
    # pages sit behind Akamai). After pip install, fetch the engine:
    #   playwright install chromium
    "playwright>=1.49",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "integration: tests that require external services",
    "unit: unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = ["notebooks", "venv", ".venv", "data", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Math / ML convention: capital X is the design matrix, T is term tenors,
# S is the rate matrix. Renaming to lowercase actively hurts readability
# in code that mirrors academic notation.
"src/rates/ois_curve.py" = ["N806"]
"src/strategies/rate_diff_mean_reversion.py" = ["N806"]
"src/strategies/_experimental/*" = ["N806"]
"src/models/rate_diff.py" = ["N806"]
"src/models/gp_rate_diff.py" = ["N806"]
"src/models/hmm_regime.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "tests/", "notebooks/", "labeling/",
    # Auto-generated experimental strategies — outputs of the research
    # pipeline, not human-edited. Strict typing here would block the
    # research loop on every new candidate.
    "src/strategies/_experimental/",
]

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "pandas",
    "pandas.*",
    "scipy",
    "scipy.*",
    "yaml",
    "statsmodels.*",
    "sklearn.*",
    "yfinance.*",
    "wolfcrypt.*",
    "pypdf.*",
    "hmmlearn.*",
    "pymc.*",
    "arviz.*",
    "py_clob_client.*",
    "web3.*",
    "eth_account.*",
    "eth_utils.*",
    "praw.*",
    "pytrends.*",
    "playwright.*",
    "whisper.*",
    "librosa.*",
    "soundfile.*",
    "imageio_ffmpeg.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/monitoring/metrics.py"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
