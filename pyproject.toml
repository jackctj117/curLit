[project]
name = "curlit"
version = "0.1.0"
description = "Algorithmic FX trading system with AI-driven analysis"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "jackctj117", email = "jackctj117@gmail.com"},
]
keywords = ["forex", "trading", "nlp", "quant"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Data processing
    "pandas>=2.0",
    "numpy>=1.24",
    "polars>=0.18",
    "pyarrow>=12.0",
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # API / HTTP
    "httpx>=0.24",
    "tenacity>=8.2",
    # Modelling
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    # NLP
    "spacy>=3.6",
    "transformers>=4.30",
    "torch>=2.0",
    "beautifulsoup4>=4.12",
    # Finance
    "fredapi>=0.5",
    "yfinance>=0.2",
    "holidays>=0.35",
    # Observability
    "prometheus-client>=0.17",
    # Web
    "fastapi>=0.100",
    "uvicorn>=0.23",
    # Labelling
    "streamlit>=1.26",
    # LLM providers (CL-h986 research pipeline)
    "anthropic>=0.40",
    "openai>=2.0",        # used as DeepSeek + xAI Grok base (OpenAI-compat)
    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "hypothesis>=6.82",
    "great-expectations>=0.17",
    "ruff>=0.1",
    "mypy>=1.5",
    "black>=23.7",
    "pre-commit>=3.3",
]
train = [
    "datasets>=2.14",
    "evaluate>=0.4",
    "tensorboard>=2.13",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
]
ibkr = [
    "ib-insync>=0.9",
]
oanda = [
    "oandapyv20>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "integration: tests that require external services",
    "unit: unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = ["notebooks", "venv", ".venv", "data", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Math / ML convention: capital X is the design matrix, T is term tenors,
# S is the rate matrix. Renaming to lowercase actively hurts readability
# in code that mirrors academic notation.
"src/rates/ois_curve.py" = ["N806"]
"src/strategies/rate_diff_mean_reversion.py" = ["N806"]
"src/strategies/_experimental/*" = ["N806"]
"src/models/rate_diff.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/", "notebooks/", "labeling/"]

[[tool.mypy.overrides]]
module = [
    "ib_insync.*",
    "oandapyv20.*",
    "streamlit.*",
    "great_expectations.*",
    "pandas",
    "pandas.*",
    "scipy",
    "scipy.*",
    "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/monitoring/metrics.py"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
