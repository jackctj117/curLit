# curLit infra stack (CL-oluv: profiled).
#
# PROFILES — read this before `up`:
#   docker compose up -d                       → LIGHT stack: postgres only
#                                                (add -f docker-compose.app.yml
#                                                for the engine container).
#   docker compose --profile full up -d        → EVERYTHING: postgres +
#                                                observability (prometheus,
#                                                grafana, loki, promtail,
#                                                alertmanager, node/pg
#                                                exporters) + airflow trio.
#
# NOTE: the PREVIOUS behavior of a bare `docker compose up -d` (all
# services) is now `docker compose --profile full up -d`.
#
# App containers live in docker-compose.app.yml:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
networks:
  observability:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
  airflow_db_data:

services:
  # =====================================================================
  # Database
  # =====================================================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: curlit-postgres
    restart: unless-stopped
    networks: [observability]
    # Publish to the HOST loopback so the native engine, migrations and
    # daemons (which connect to 127.0.0.1:5432, not the Docker network) can
    # actually reach it — without this, `docker compose up` starts a Postgres
    # only other containers can see, and every host-side step fails to connect
    # (the README/BOOTSTRAP bring-up assumed a reachable localhost:5432). Bound
    # to loopback only. Mirrors the standalone curlit-postgres-soak container
    # BOOTSTRAP documents; run ONE of the two, never both (they share :5432).
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fx}
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fx} -d ${POSTGRES_DB:-fx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # Metrics
  # =====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: curlit-prometheus
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =====================================================================
  # Dashboards
  # =====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: curlit-grafana
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: ""
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =====================================================================
  # Logs
  # =====================================================================
  loki:
    image: grafana/loki:latest
    container_name: curlit-loki
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 3

  promtail:
    image: grafana/promtail:latest
    container_name: curlit-promtail
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - ./logs:/opt/fx-system/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  # =====================================================================
  # Alerts
  # =====================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: curlit-alertmanager
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.tmpl:/etc/alertmanager/alertmanager.tmpl:ro
      - ./alertmanager/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      # Telegram is the sole alert channel (CL-b92t; Pushover removed).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =====================================================================
  # Host/DB metrics
  # =====================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: curlit-node-exporter
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: curlit-pg-exporter
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-fx}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-fx}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =====================================================================
  # Airflow
  # =====================================================================
  airflow-db:
    image: postgres:15-alpine
    container_name: curlit-airflow-db
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: curlit-airflow-init
    profiles: ["full"]
    networks: [observability]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir pandas sqlalchemy psycopg2-binary httpx tenacity beautifulsoup4 pyyaml &&
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@localhost \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: curlit-airflow-webserver
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    command: airflow webserver
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-to-random}
      PYTHONPATH: /opt/curlit/src:/opt/curlit
      # Ingestion writes to the HOST-side postgres (curlit-postgres-soak,
      # published on 127.0.0.1:5432) — the same DB the engine reads.
      # Pointing at the in-network `postgres` service split the data:
      # fresh rows landed in a DB the engine never sees.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fx}:${POSTGRES_PASSWORD:-changeme}@host.docker.internal:5432/${POSTGRES_DB:-fx}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_DB: ${POSTGRES_DB:-fx}
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      FRED_API_KEY: ${FRED_API_KEY}
    extra_hosts:
      # host.docker.internal only auto-resolves on Docker Desktop;
      # Linux Docker Engine needs the host-gateway mapping.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/curlit/src:ro
      # event_ingestion DAG reads configs/event_playbooks.yaml (CL-i4sr)
      - ./configs:/opt/curlit/configs:ro
      - ./pyproject.toml:/opt/curlit/pyproject.toml:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: curlit-airflow-scheduler
    profiles: ["full"]
    restart: unless-stopped
    networks: [observability]
    command: airflow scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/curlit/src:/opt/curlit
      # Ingestion writes to the HOST-side postgres (curlit-postgres-soak,
      # published on 127.0.0.1:5432) — the same DB the engine reads.
      # Pointing at the in-network `postgres` service split the data:
      # fresh rows landed in a DB the engine never sees.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fx}:${POSTGRES_PASSWORD:-changeme}@host.docker.internal:5432/${POSTGRES_DB:-fx}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_DB: ${POSTGRES_DB:-fx}
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      FRED_API_KEY: ${FRED_API_KEY}
    extra_hosts:
      # host.docker.internal only auto-resolves on Docker Desktop;
      # Linux Docker Engine needs the host-gateway mapping.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/curlit/src:ro
      # event_ingestion DAG reads configs/event_playbooks.yaml (CL-i4sr)
      - ./configs:/opt/curlit/configs:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
