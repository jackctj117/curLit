<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>curLit</title>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --text: #e0e0e0; --accent: #0f3460; --green: #00c853; --red: #ff1744; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        nav { width: 220px; background: var(--panel); padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        nav a { color: var(--text); text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }
        nav a:hover, nav a.active { background: var(--accent); }
        main { flex: 1; padding: 1.5rem; }
        .card { background: var(--panel); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .stat { text-align: center; }
        .stat .value { font-size: 2rem; font-weight: bold; }
        .green { color: var(--green); }
        .red { color: var(--red); }
       table { width: 100%; border-collapse: collapse; }
       th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--accent); }
    </style>
</head>
<body>
<nav>
    <h2>curLit</h2>
    <a href="#dashboard" class="active">Dashboard</a>
    <a href="#signals">Signals</a>
    <a href="#positions">Positions</a>
    <a href="#config">Config</a>
    <a href="#system">System</a>
</nav>
<main>
    <div class="card stat-grid" id="stats">
        <div class="stat"><div>Equity</div><div class="value" id="equity">--</div></div>
        <div class="stat"><div>Day PnL</div><div class="value" id="pnl">--</div></div>
        <div class="stat"><div>Drawdown</div><div class="value" id="dd">--</div></div>
        <div class="stat"><div>Positions</div><div class="value" id="posCount">0</div></div>
    </div>
    <div class="card">
        <h3>Engine Status</h3>
        <p id="status">Checking...</p>
    </div>
</main>
<script>
const API = '/api';
async function fetchData() {
    try {
        const [sys, acct] = await Promise.all([
            fetch(API + '/system').then(r => r.json()),
            fetch(API + '/account').then(r => r.json()),
        ]);
        document.getElementById('status').textContent = sys.engine || 'unknown';
        document.getElementById('equity').textContent = acct.equity ? '$' + acct.equity.toLocaleString() : '--';
        document.getElementById('dd').textContent = acct.drawdown_pct ? (acct.drawdown_pct * 100).toFixed(1) + '%' : '--';
    } catch (e) {
        document.getElementById('status').textContent = 'API unreachable';
    }
}
fetchData();
setInterval(fetchData, 15000);
</script>
</body>
</html>
